name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types and tests
        run: npm run check
      - name: Build (content schemas and solvability checks run here)
        run: npm run build
      - name: No answers or writeups in the built site
        run: npm run leaks
